name: Shrimp External Intelligence Scraper

on:
  schedule:
    # 매월 1일 자정(UTC 기준)에 자동 실행
    - cron: '0 0 1 * *'
  workflow_dispatch: # 수동으로 원할 때 언제든 실행 가능하도록 설정

jobs:
  scrape-and-save:
    runs-on: ubuntu-latest

    permissions:
      contents: write # 리포지토리에 변경사항을 커밋하기 위한 권한

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # 안정적인 최신 Python 버전 사용

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 requests feedparser

      - name: Run Shrimp Scraper Script
        run: python scripts/fetch_shrimp_external_intelligence.py

      # 산출물은 `data/` 아래라 .gitignore:53 에 걸려 커밋되지 않는다(L-08, 대용량 데이터 git 금지).
      # 이 수집물을 읽는 대시보드 코드도 없다 — 사람이 읽는 조사 자료다.
      # 정본 보관처는 Drive 의 `agri_data/01_수산물(Seafood)/shrimp/00_shrimp_관련자료/` 이고
      # CI 는 거기에 쓸 수 없으므로, 커밋 대신 아티팩트로 남겨 내려받아 정리하게 한다.
      - name: Upload collected reports
        uses: actions/upload-artifact@v4
        with:
          name: shrimp-external-intelligence-${{ github.run_id }}
          path: data/새우/External_*.md
          if-no-files-found: warn
          retention-days: 90
