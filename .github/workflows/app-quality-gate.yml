name: App Quality Gate

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'e2e/**'
      - 'lib/**'
      - '__tests__/**'
      - 'data/reefer_week*.json'
      - 'public/data/cosmo/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/sync_cosmo_weekly.py'
      - 'scripts/sync_reefer_weekly.py'
      - 'scripts/test_sync_cosmo_weekly.py'
      - 'scripts/test_sync_reefer_weekly.py'
      - 'scripts/requirements-dashboard-sync.txt'
      - 'scripts/audit_api_cache_policy.mjs'
      - 'scripts/check_route_bundle_budget.mjs'
      - 'scripts/a11y_audit.mjs'
      - 'scripts/check_a11y_baseline.mjs'
      - 'scripts/a11y-baseline.json'
      - 'eslint.config.mjs'
      - 'tsconfig.json'
      - 'next.config.mjs'
      - '.github/workflows/app-quality-gate.yml'
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'components/**'
      - 'e2e/**'
      - 'lib/**'
      - '__tests__/**'
      - 'data/reefer_week*.json'
      - 'public/data/cosmo/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/sync_cosmo_weekly.py'
      - 'scripts/sync_reefer_weekly.py'
      - 'scripts/test_sync_cosmo_weekly.py'
      - 'scripts/test_sync_reefer_weekly.py'
      - 'scripts/requirements-dashboard-sync.txt'
      - 'scripts/audit_api_cache_policy.mjs'
      - 'scripts/check_route_bundle_budget.mjs'
      - 'scripts/a11y_audit.mjs'
      - 'scripts/check_a11y_baseline.mjs'
      - 'scripts/a11y-baseline.json'
      - 'eslint.config.mjs'
      - 'tsconfig.json'
      - 'next.config.mjs'
      - '.github/workflows/app-quality-gate.yml'
  workflow_dispatch:

jobs:
  verify:
    name: lint typecheck test build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements-dashboard-sync.txt

      - name: Install dashboard sync dependencies
        run: python -m pip install -r scripts/requirements-dashboard-sync.txt

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Run quality gate
        run: npm run verify

      - name: Run unloading history browser acceptance
        run: npm run test:e2e:unloading-history

  # 접근성(axe) 기준선 게이트 — critical·serious 노드가 기준선보다 늘면 실패.
  # 전 화면 1테마 감사가 ~13.5분(2026-10-08 실측)이라 2테마를 verify job(20분)에 못 넣는다(다크는 ~17분) → 테마별 병렬 job.
  # 빌드는 job 마다 다시 한다: .next 산출물(캐시 제외 ~137MB)을 artifact 로 넘기면
  # 「빌드 job → 업로드 → 다운로드」가 직렬로 붙어 job 안에서 빌드(~1.5분)하는 것보다 항상 길다.
  a11y:
    name: a11y baseline (${{ matrix.theme }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        theme: [light, dark]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Check baseline script self-test
        run: node scripts/check_a11y_baseline.mjs --self-test

      - name: Build
        run: npm run build

      - name: Run axe audit
        run: npm run a11y -- --theme ${{ matrix.theme }} --out artifacts/a11y/${{ matrix.theme }}

      - name: Compare with baseline
        if: ${{ !cancelled() }}
        run: >-
          node scripts/check_a11y_baseline.mjs
          --report artifacts/a11y/${{ matrix.theme }}/report.json
          --md artifacts/a11y/${{ matrix.theme }}/gate.md

      - name: Upload a11y report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report-${{ matrix.theme }}
          path: |
            artifacts/a11y/${{ matrix.theme }}/report.md
            artifacts/a11y/${{ matrix.theme }}/gate.md
            artifacts/a11y/${{ matrix.theme }}/report.json
          if-no-files-found: warn
