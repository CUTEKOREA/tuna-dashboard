name: Thai MOC HS Code 전수 조사

on:
  schedule:
    - cron: '0 0 1 * *' # 매월 1일 자정 (UTC)
  workflow_dispatch: # 수동 실행 트리거

jobs:
  scan-hs-codes:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Thai MOC HS Code Scanner
        run: python scripts/thai_moc_hs_code_scanner.py

      - name: Commit and Push Updated HS Codes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/thai_moc_hs_codes.json
          
          # 변경사항이 있을 경우에만 커밋 및 푸시
          if git diff --staged --quiet; then
            echo "No changes in HS codes."
          else
            git commit -m "chore(thai-moc): auto-update Thai MOC HS codes catalog [skip ci]"
            git push
          fi
