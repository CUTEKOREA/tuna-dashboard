name: Korea Consignment Data Sync

on:
  schedule:
    - cron: '15 */6 * * *'
  workflow_dispatch:

concurrency:
  group: korea-consignment-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Synchronize consignment data
        env:
          FISHERY_API_KEY: ${{ secrets.FISHERY_API_KEY }}
          DATA_GO_KR_NEW_KEY: ${{ secrets.DATA_GO_KR_NEW_KEY }}
        run: npm run sync:consignment

      - name: Commit synchronized data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/consignment_3year.json public/data/consignment_sync_state.json
          if git diff --staged --quiet; then
            echo "No consignment data changes"
          else
            git commit -m "data(korea-market): sync official consignment records [GitHub Actions]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
