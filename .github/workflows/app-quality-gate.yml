name: App Quality Gate

on:
  pull_request:
    paths:
      - 'app/**'
      - 'components/**'
      - 'e2e/**'
      - 'lib/**'
      - '__tests__/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/audit_api_cache_policy.mjs'
      - 'scripts/check_route_bundle_budget.mjs'
      - 'eslint.config.mjs'
      - 'tsconfig.json'
      - 'next.config.mjs'
      - '.github/workflows/app-quality-gate.yml'
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'components/**'
      - 'e2e/**'
      - 'lib/**'
      - '__tests__/**'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/audit_api_cache_policy.mjs'
      - 'scripts/check_route_bundle_budget.mjs'
      - 'eslint.config.mjs'
      - 'tsconfig.json'
      - 'next.config.mjs'
      - '.github/workflows/app-quality-gate.yml'
  workflow_dispatch:

jobs:
  verify:
    name: lint typecheck test build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Run quality gate
        run: npm run verify

      - name: Run unloading history browser acceptance
        run: npm run test:e2e:unloading-history
