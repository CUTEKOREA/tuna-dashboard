name: Thai MOC HS Code 전수 조사

on:
  schedule:
    - cron: '0 0 1 * *' # 매월 1일 자정 (UTC)
  workflow_dispatch: # 수동 실행 트리거

jobs:
  scan-hs-codes:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Thai MOC HS Code Scanner
        run: python scripts/thai_moc_hs_code_scanner.py

      # 산출물은 `data/` 아래라 .gitignore:53 에 걸려 커밋되지 않는다(L-08).
      # 이 카탈로그를 읽는 대시보드 코드도 없다 — 조사용 참조 자료다.
      # 정본 보관처는 Drive 의 `agri_data/13_공통(General)/02_공통자료/` 이고 CI 는 거기에 쓸 수 없으므로,
      # 커밋 대신 아티팩트로 남겨 내려받아 정리하게 한다.
      - name: Upload HS code catalog
        uses: actions/upload-artifact@v4
        with:
          name: thai-moc-hs-codes-${{ github.run_id }}
          path: data/thai_moc_hs_codes.json
          if-no-files-found: warn
          retention-days: 90
